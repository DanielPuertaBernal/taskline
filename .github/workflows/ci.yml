name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  omarchy:
    name: Omarchy installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh scripts/*.sh tests/*.sh omarchy/taskwarrior-hooks/on-exit.omarchy-bar omarchy/danso.tasks/taskline-update
      - name: Validate plugin manifest
        run: jq -e '.id == "danso.tasks" and (.entryPoints | has("barWidget"))' omarchy/danso.tasks/manifest.json
      - name: Versions agree
        run: |
          v=$(jq -r .version omarchy/danso.tasks/manifest.json)
          grep -q "^version = \"$v\"" windows/Cargo.toml
          echo "version $v"
      - name: Panel logic tests (due dates, priority, sorting, calendar, themes)
        run: TZ=America/Bogota node tests/logic_test.js
      - name: QML syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools >/dev/null
          QMLLINT=/usr/lib/qt6/bin/qmllint bash tests/qml_syntax.sh
      - name: Install/uninstall tests (temporary HOME)
        run: bash tests/install_test.sh
      - name: Auto-update tests (fake release, temporary HOME)
        run: bash tests/update_test.sh
      - name: Package
        run: scripts/package-omarchy.sh

  core:
    name: Windows app core (fmt, clippy, tests on Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo fmt --all --check
      - run: cargo clippy -p taskline-core --all-targets -- -D warnings
      - name: Tests (store, v1.0/v1.1/v1.2 data, calendar, updater)
        run: TZ=America/Bogota cargo test -p taskline-core

  windows:
    name: Windows .exe (clippy, tests, build, selftest, upgrade from v1.2)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests on Windows
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --locked
      - name: Selftest the built exe (demo data, both themes, updater, Run key)
        env:
          TASKLINE_SELFTEST_REGISTRY: "1"
        run: ./selftest.ps1
      - name: Upgrade from the published v1.2.0, then self-update
        run: ./tests/upgrade.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskline-windows
          path: |
            windows/target/release/taskline.exe
            windows/dist/
