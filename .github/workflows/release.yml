name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the version in the code
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $v" }
      - run: cargo test --workspace
      - run: cargo build --release --locked -p taskline
      - run: ./selftest.ps1
      - run: ./tests/upgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: windows/target/release/taskline.exe

  omarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in the code
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version omarchy/danso.tasks/manifest.json)"
      - run: TZ=America/Bogota node tests/logic_test.js
      - name: QML syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools >/dev/null
          QMLLINT=/usr/lib/qt6/bin/qmllint bash tests/qml_syntax.sh
      - run: bash tests/install_test.sh
      - run: bash tests/update_test.sh
      - run: scripts/package-omarchy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy
          path: dist/taskline-omarchy.tar.gz

  release:
    needs: [windows, omarchy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum taskline.exe taskline-omarchy.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/taskline.exe out/taskline-omarchy.tar.gz out/SHA256SUMS.txt install.sh \
            --title "Taskline $GITHUB_REF_NAME" --generate-notes --verify-tag
