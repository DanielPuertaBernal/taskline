[package]
name = "taskline"
description = "Taskline: your day, as one line"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "taskline"
path = "src/main.rs"

[dependencies]
taskline-core = { path = "../taskline-core" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "canvas", "svg", "advanced", "smol"] }
serde_json.workspace = true
chrono.workspace = true
png = "0.17"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Development on Linux only; the release is Windows-only.
iced = { version = "0.14", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
rfd = "0.15"
raw-window-handle = "0.6"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
iced_test = "0.14"
