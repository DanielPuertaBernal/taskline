[project]
name = "taskline"
version = "1.2.0"
description = "Daily task progress bar for Windows, a sibling of the Omarchy Taskline widget"
authors = [{ name = "Daniel Puerta" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pystray>=0.19.5", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
taskline = "taskline.app:main"

[tool.setuptools]
packages = ["taskline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
