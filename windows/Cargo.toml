[workspace]
resolver = "3"
members = ["crates/taskline-core", "crates/taskline-app"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Daniel Puerta"]
repository = "https://github.com/DanielPuertaBernal/taskline"
rust-version = "1.88"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
